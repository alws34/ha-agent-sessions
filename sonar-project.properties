sonar.projectKey=alws34_ha-agent-sessions
# Set these to the organization and project key you create on sonarcloud.io (see docs/OPENSSF.md).
sonar.organization=alws34
sonar.projectName=Agent Sessions for Home Assistant

sonar.sources=custom_components,agent
sonar.tests=tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
# The card has no JS coverage report (its logic is tested under Node from pytest), and the agent
# script is loaded from pytest without a .py name, which coverage.py does not report.
sonar.coverage.exclusions=custom_components/agent_sessions/www/**,agent/**
