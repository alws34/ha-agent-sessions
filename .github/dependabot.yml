version: 2
# Version updates: monthly, one grouped PR per ecosystem. Security fixes open as soon as an
# alert does, grouped per ecosystem.
updates:
  # requirements_test.txt (pinned test/lint tooling). The integration's runtime requirement
  # (asyncssh in manifest.json) is a lower bound that Home Assistant resolves.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # SHA-pinned actions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
