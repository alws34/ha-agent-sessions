name: Bug report
description: Something doesn't work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Security problems: please don't open an issue. Report them privately (Security tab →
        Report a vulnerability), see SECURITY.md. Don't paste private keys, session transcripts or
        prompts here.
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Settings → Devices & services → Agent Sessions, or HACS.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: OS, Python version, and the Claude Code / Codex CLI version on the server.
      placeholder: "Ubuntu 24.04, Python 3.12, Claude Code 2.1.328"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the command shown at the bottom of the New session dialog if it is about flags.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Home Assistant log lines for custom_components.agent_sessions (remove host names if you like).
      render: text
